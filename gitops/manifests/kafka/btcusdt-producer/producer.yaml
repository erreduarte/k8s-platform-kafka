apiVersion: apps/v1
kind: Deployment
metadata:
  name: btcusdt-producer
  labels:
    app.kubernetes.io/name: btcusdt-producer
    app.kubernetes.io/part-of: kafka
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: btcusdt-producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: btcusdt-producer
        app.kubernetes.io/part-of: kafka
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: btcusdt-producer
          image: ghcr.io/erreduarte/k8s-platform-kafka-btcusdt-producer:main
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: kafka-flink-credentials
                  key: bootstrapServers
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-flink-credentials
                  key: username
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-flink-credentials
                  key: password

---
# A restart forces every CoreDNS pod to reload RBAC and its rendered Corefile
# before the readiness gate is evaluated.
- name: Restart CoreDNS
  ansible.builtin.command:
    cmd: kubectl -n {{ coredns_namespace }} rollout restart deployment coredns
  changed_when: true

- name: Reload systemd manager
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Argo CD port-forward
  ansible.builtin.systemd:
    name: argocd-port-forward.service
    state: restarted
    daemon_reload: true

- name: Restart Grafana port-forward
  ansible.builtin.systemd:
    name: grafana-port-forward.service
    state: restarted
    daemon_reload: true

- name: Restart Kafka UI port-forward
  ansible.builtin.systemd:
    name: kafka-ui-port-forward.service
    state: restarted
    daemon_reload: true

- name: Restart Kafka UI deployment
  ansible.builtin.command:
    argv:
      - /usr/bin/kubectl
      - -n
      - kafka-ui
      - rollout
      - restart
      - deployment/kafka-ui
  changed_when: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
# This handler is notified after the Kafka UI Secret is updated.

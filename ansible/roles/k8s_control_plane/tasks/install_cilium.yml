---
# Install Cilium as the cluster CNI via Helm, with kube-proxy replacement, Hubble observability
# (agent + relay + UI), and Gateway API support enabled.
# Docs:
#   https://docs.cilium.io/en/stable/installation/k8s-install-helm/#installation-using-helm
#   https://docs.cilium.io/en/stable/network/servicemesh/gateway-api/gateway-api/
#   https://gateway-api.sigs.k8s.io/guides/#installing-gateway-api

## INSTALL GATEWAY API CRDs
# These CRDs must exist BEFORE Cilium is installed with gatewayAPI.enabled=true, otherwise the
# Cilium operator stays in CrashLoop until they appear. 'changed_when' filters the kubectl apply
# output so re-runs only report changed when something was actually modified.

- name: Install Gateway API CRDs
  ansible.builtin.command:
    cmd: >-
      kubectl apply -f
      https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/{{ gateway_api_channel }}-install.yaml
  register: gateway_api_crds
  changed_when: "'configured' in gateway_api_crds.stdout or 'created' in gateway_api_crds.stdout"
  when: not ansible_check_mode


## INSTALL CILIUM VIA HELM (OCI registry)
# Cilium charts are pulled directly from the OCI registry per upstream recommendation:
# no separate `helm repo add` is needed and charts are signed with cosign.

# Verify the chart signature before installing. cosign confirms the chart was published by
# Cilium's official GitHub Actions pipeline (Sigstore keyless signing). Catches a compromised
# registry, a MITM on the way to quay.io, or a republished tag pointing at a different digest.
# `changed_when: false` because verification is read-only.
- name: Verify Cilium chart signature with cosign
  ansible.builtin.command:
    cmd: >-
      cosign verify
      --new-bundle-format
      --certificate-identity-regexp=https://github.com/cilium/cilium/.*
      --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      quay.io/cilium/charts/cilium:{{ cilium_version }}
  changed_when: false


# Why these values matter:
#   ipam.mode=kubernetes          — pods get IPs from the per-node CIDR that kube-controller-manager
#                                   allocates, matching --pod-network-cidr from kubeadm init.
#   kubeProxyReplacement=true     — Cilium handles Service routing in eBPF instead of kube-proxy
#                                   (we already skipped that addon in initialize_cluster.yml).
#   k8sServiceHost/Port           — without kube-proxy, Cilium pods cannot rely on the kubernetes
#                                   Service ClusterIP; they need a direct apiserver address.
#   hubble.*                      — enables traffic observability and the web UI.
#   gatewayAPI.enabled            — turns on Cilium's Gateway API controller for ingress routing.

- name: Install Cilium release
  kubernetes.core.helm:
    name: cilium
    chart_ref: oci://quay.io/cilium/charts/cilium
    chart_version: "{{ cilium_version }}"
    release_namespace: "{{ cilium_namespace }}"
    create_namespace: false
    kubeconfig: /root/.kube/config
    wait: true
    wait_timeout: 5m
    values:
      ipam:
        mode: kubernetes
      kubeProxyReplacement: true
      k8sServiceHost: "{{ ansible_facts['default_ipv4']['address'] }}"
      k8sServicePort: 6443
      hubble:
        enabled: true
        relay:
          enabled: true
        ui:
          enabled: true
      gatewayAPI:
        enabled: true

---
- name: Verify Kafka UI administrator credentials
  ansible.builtin.assert:
    that:
      - kafka_ui_admin_user is match('^[A-Za-z0-9._-]+$')
      - kafka_ui_admin_password is match('^[A-Za-z0-9._-]{32,}$')
    fail_msg: >-
      KAFKA_ADMIN_PASSWORD must contain at least 32 letters, digits, periods,
      underscores, or hyphens.
  no_log: true

- name: Deploy Kafka UI SASL configuration
  ansible.builtin.template:
    src: kafka-ui-jaas.conf.j2
    dest: "{{ kafka_ui_credentials_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not ansible_check_mode

- name: Render Kafka UI credentials Secret
  ansible.builtin.command:
    argv:
      - /usr/bin/kubectl
      - -n
      - kafka-ui
      - create
      - secret
      - generic
      - kafka-ui-credentials
      - "--from-file=sasl-jaas-config={{ kafka_ui_credentials_path }}"
      - --dry-run=client
      - --output=yaml
  register: kafka_ui_credentials_manifest
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  no_log: true
  when: not ansible_check_mode

- name: Apply Kafka UI credentials Secret
  ansible.builtin.command:
    argv:
      - /usr/bin/kubectl
      - apply
      - --filename=-
    stdin: "{{ kafka_ui_credentials_manifest.stdout }}"
  register: kafka_ui_credentials_secret
  changed_when: >-
    'created' in kafka_ui_credentials_secret.stdout or
    'configured' in kafka_ui_credentials_secret.stdout
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  no_log: true
  when: not ansible_check_mode

  notify: Restart Kafka UI deployment
# The handler restarts Kafka UI only after its Secret changes.

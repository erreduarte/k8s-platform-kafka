---
# Install cosign from the upstream binary release. Used by install_cilium.yml to verify the
# Cilium chart signature before installing. Skipped entirely when the installed version already
# matches cosign_version, so re-runs do not re-download the binary.
# Docs: https://docs.sigstore.dev/cosign/system_config/installation/

- name: Check installed cosign version
  ansible.builtin.command:
    cmd: cosign version
  register: cosign_installed_version
  failed_when: false
  changed_when: false
  check_mode: false


# True when cosign is missing or running a different version than requested. The output of
# `cosign version` includes a line like 'GitVersion: v2.4.1'.
- name: Set cosign_install_needed fact
  ansible.builtin.set_fact:
    cosign_install_needed: >-
      {{ cosign_installed_version.rc != 0
         or cosign_version not in cosign_installed_version.stdout }}


# Translate the host CPU architecture into the suffix used by the cosign release filename.
# Same mapping as install_helm.yml.
- name: Set cosign download architecture
  ansible.builtin.set_fact:
    cosign_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
  when: cosign_install_needed


- name: Install cosign binary
  ansible.builtin.get_url:
    url: "https://github.com/sigstore/cosign/releases/download/{{ cosign_version }}/cosign-linux-{{ cosign_arch }}"
    dest: /usr/local/bin/cosign
    owner: root
    group: root
    mode: "0755"
  when: cosign_install_needed

---
- name: Deploy Kafka UI port-forward systemd service
  ansible.builtin.template:
    src: kafka-ui-port-forward.service.j2
    dest: /etc/systemd/system/kafka-ui-port-forward.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Kafka UI port-forward

- name: Ensure Kafka UI port-forward service is enabled and started
  ansible.builtin.systemd:
    name: kafka-ui-port-forward.service
    state: started
    enabled: true
    daemon_reload: true

---
- name: Verify Grafana administrator credentials
  ansible.builtin.assert:
    that:
      - grafana_admin_user is match('^[A-Za-z0-9._-]+$')
      - grafana_admin_password | length >= 32
    fail_msg: >-
      GRAFANA_ADMIN_PASSWORD must contain at least 32 characters and must be
      supplied through the protected deployment environment.
  no_log: true

- name: Ensure the Grafana namespace exists
  ansible.builtin.shell: # noqa: command-instead-of-shell
    cmd: kubectl create namespace {{ grafana_namespace }} --dry-run=client --output=yaml | kubectl apply --filename=-
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: not ansible_check_mode

- name: Apply Grafana administrator credentials Secret
  ansible.builtin.shell: # noqa: command-instead-of-shell
    cmd: kubectl apply --filename=-
    stdin: "{{ lookup('ansible.builtin.template', 'grafana-admin-credentials.yaml.j2') }}"
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  no_log: true
  when: not ansible_check_mode

---
- name: Deploy Argo CD port-forward systemd service
  ansible.builtin.template:
    src: argocd-port-forward.service.j2
    dest: /etc/systemd/system/argocd-port-forward.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Argo CD port-forward

- name: Ensure Argo CD port-forward service is enabled and started
  ansible.builtin.systemd:
    name: argocd-port-forward.service
    state: started
    enabled: true
    daemon_reload: true

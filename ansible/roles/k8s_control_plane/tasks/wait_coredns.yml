---
# CoreDNS can be Running while its Kubernetes plugin is still unavailable. Wait
# for Ready so Argo CD is not installed until internal service discovery works.
- name: Wait for CoreDNS pods to become Ready
  ansible.builtin.command:
    cmd: >-
      kubectl wait
      --for=condition=Ready
      --timeout=30s
      -n {{ coredns_namespace }}
      pod -l k8s-app=kube-dns
  register: coredns_ready
# Pods may still be starting immediately after Cilium is installed. Retry for
# approximately ten minutes, matching the other Kubernetes readiness gates.
  until: coredns_ready.rc == 0
  retries: 20
  delay: 30
  changed_when: false
  when: not ansible_check_mode

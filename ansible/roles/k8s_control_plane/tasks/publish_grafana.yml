---
- name: Deploy Grafana port-forward systemd service
  ansible.builtin.template:
    src: grafana-port-forward.service.j2
    dest: /etc/systemd/system/grafana-port-forward.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana port-forward

- name: Ensure Grafana port-forward service is enabled and started
  ansible.builtin.systemd:
    name: grafana-port-forward.service
    state: started
    enabled: true
    daemon_reload: true

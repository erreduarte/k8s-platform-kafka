name: apply_terraform_proxmox

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: >-
          Type APPLY_TERRAFORM_PROXMOX to apply the reviewed plan from main.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-proxmox-operations
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    name: Apply approved Proxmox changes
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ansible]
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      PROXMOX_VE_INSECURE: ${{ secrets.PROXMOX_VE_INSECURE }}

    steps:
      - name: Confirm apply is intentional
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "APPLY_TERRAFORM_PROXMOX"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Initialize remote state
        run: make setup

      - name: Create and display apply plan
        run: |
          terraform plan -out=tfplan -no-color
          terraform show -no-color tfplan

      - name: Apply reviewed plan
        run: terraform apply -no-color tfplan

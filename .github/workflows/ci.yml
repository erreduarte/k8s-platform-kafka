name: ci

on:
  pull_request:
    branches: [main]
    paths:
      - "ansible/**"
      - "gitops/**"
      - "kafka/**"
      - "terraform/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker-consumer.yml"
      - ".github/workflows/docker-producer.yml"
      - ".github/workflows/verify_terraform_proxmox.yml"
      - ".github/workflows/apply_terraform_proxmox.yml"
      - ".github/workflows/deploy.yml"
      - ".github/copilot-instructions.md"
      - "AGENTS.md"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "requirements-dev.txt"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - "gitops/**"
      - "kafka/**"
      - "terraform/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker-consumer.yml"
      - ".github/workflows/docker-producer.yml"
      - ".github/workflows/verify_terraform_proxmox.yml"
      - ".github/workflows/apply_terraform_proxmox.yml"
      - ".github/workflows/deploy.yml"
      - ".github/copilot-instructions.md"
      - "AGENTS.md"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "requirements-dev.txt"
      - "scripts/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed domains
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      gitops: ${{ steps.filter.outputs.gitops }}
      kafka: ${{ steps.filter.outputs.kafka }}
      ansible: ${{ steps.filter.outputs.ansible }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed domains
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/verify_terraform_proxmox.yml'
              - '.github/workflows/apply_terraform_proxmox.yml'
              - '.github/copilot-instructions.md'
              - 'AGENTS.md'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - 'requirements-dev.txt'
              - 'scripts/**'
            gitops:
              - 'gitops/**'
              - '.github/workflows/ci.yml'
              - '.github/copilot-instructions.md'
              - 'AGENTS.md'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - 'requirements-dev.txt'
              - 'scripts/**'
            kafka:
              - 'kafka/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docker-consumer.yml'
              - '.github/workflows/docker-producer.yml'
              - '.github/copilot-instructions.md'
              - 'AGENTS.md'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - 'requirements-dev.txt'
              - 'scripts/**'
            ansible:
              - 'ansible/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
              - '.github/copilot-instructions.md'
              - 'AGENTS.md'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - 'requirements-dev.txt'
              - 'scripts/**'
            any:
              - 'ansible/**'
              - 'gitops/**'
              - 'kafka/**'
              - 'terraform/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docker-consumer.yml'
              - '.github/workflows/docker-producer.yml'
              - '.github/workflows/verify_terraform_proxmox.yml'
              - '.github/workflows/apply_terraform_proxmox.yml'
              - '.github/workflows/deploy.yml'
              - '.github/copilot-instructions.md'
              - 'AGENTS.md'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - 'requirements-dev.txt'
              - 'scripts/**'

  terraform-validate:
    name: Terraform validation
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Initialize providers without remote state
        run: terraform init -backend=false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate configuration
        run: terraform validate

  gitops-build:
    name: GitOps build
    needs: changes
    if: needs.changes.outputs.gitops == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitops
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gitops/requirements-dev.txt

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install validation dependencies
        run: make setup

      - name: Build validation
        run: make compile

  gitops-lint:
    name: GitOps lint
    needs:
      - changes
      - gitops-build
    if: needs.changes.outputs.gitops == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitops
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gitops/requirements-dev.txt

      - name: Install validation dependencies
        run: make setup

      - name: Lint manifests
        run: make lint

  gitops-argocd:
    name: GitOps Argo CD
    needs:
      - changes
      - gitops-build
    if: needs.changes.outputs.gitops == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitops
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gitops/requirements-dev.txt

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install validation dependencies
        run: make setup

      - name: Render Argo CD Helm applications
        run: make argocd-validate

  gitops-test:
    name: GitOps test
    needs:
      - changes
      - gitops-build
    if: needs.changes.outputs.gitops == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitops
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gitops/requirements-dev.txt

      - name: Install validation dependencies
        run: make setup

      - name: Run validation unit tests
        run: make unit-tests

  kafka-build:
    name: Kafka build
    needs: changes
    if: needs.changes.outputs.kafka == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: kafka/uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Compile Python sources
        run: make compile

  kafka-test:
    name: Kafka test
    needs:
      - changes
      - kafka-build
    if: needs.changes.outputs.kafka == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: kafka/uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run required checks
        run: make check

  kafka-quality:
    name: Kafka quality
    needs:
      - changes
      - kafka-build
    if: needs.changes.outputs.kafka == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: kafka/uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run lint
        run: make lint

      - name: Run drift checks
        run: make drift

      - name: Run complexity checks
        run: make complexity

  ansible-compile:
    name: Ansible compile
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Check playbook syntax
        run: ansible-playbook --syntax-check site.yml -i inventory/hosts.yml

  build:
    name: build
    if: >-
      always() &&
      needs.changes.outputs.any == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    needs:
      - changes
      - terraform-validate
      - gitops-build
      - kafka-build
      - ansible-compile
    steps:
      - name: Confirm build-equivalent jobs passed
        run: echo "Build backstop passed"

  test:
    name: test
    if: >-
      always() &&
      needs.changes.outputs.any == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: self-hosted
    needs:
      - changes
      - build
      - gitops-test
      - gitops-argocd
      - kafka-test
    steps:
      - name: Confirm test-equivalent jobs passed
        run: echo "Test backstop passed"
